[!- extends "_wrappers/wrapper.html" -!]
[!- block main -!]



<bitty-4-0 data-connect="/tools/calculate-google-fonts/calculate-google-fonts.on.js" 
  data-send="rawFont"
  class="load-hider">

  <div>
    <pre data-receive="display">Preparing (see console for status)</pre>
  </div>

  <div class="test-font-google">
    <div class="test-google-font-target">
      <div class="trimmed test-font-family accent" data-receive="rawFont">b</div>
    </div>
    <div class="test-google-font-active">
      <div class="trimmed test-font-family warning" data-receive="checkSize">b</div>
    </div>
  </div>
  <div>
    <button data-send="copyData">Copy current JSON Data</button>
  </div>

</bitty-4-0>

[!- endblock -!]
